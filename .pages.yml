media:
  input: static/img
  output: /img

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: content/post
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, date, image, author]
      sort: date
      order: desc
    fields:
      - name: title
        type: string
        required: true

      - name: date
        type: date
        options:
          format: "yyyy-MM-dd"

      - name: description
        type: text

      - name: image
        type: image
        label: Cover Image

      - name: image_alt
        type: string
        label: Cover Image Alt Text
        description: Short description of the cover image, for screen readers and SEO
        required: false

      - name: author
        label: Author
        type: select
        options:
          values:
            - Mr. JH
            - Mr Wnow
        required: false

      - name: tags
        label: Tags
        type: string
        list: true
        required: false

      - name: categories
        label: Categories
        type: string
        list: true
        required: false

      - name: body
        label: Article Content
        type: rich-text