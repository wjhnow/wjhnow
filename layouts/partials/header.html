<header class="ad-header">
  <div class="header-container">
    <div class="header-left">
      <button class="hamburger-menu" id="menuToggle" aria-label="Toggle Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <a href="{{ .Site.BaseURL }}" class="ad-logo-text">
        <span class="logo-title">WJH.now</span>
        <span class="logo-tagline">WHAT JUST HAPPENED NOW</span>
      </a>
    </div>
  </div>

  <!-- Header Masthead Tagline -->
  <div class="site-masthead-tagline">
    <p class="tagline-text">The internet is full of news. We do the weird stuff. Science, space, and tech facts you didn't know you needed.</p>
  </div>

  <!-- Navigation Drawer -->
  <nav class="nav-drawer" id="navDrawer">
    <ul class="nav-links">
      <li><a href="{{ (site.GetPage "page/about").RelPermalink }}">About WJHnow</a></li>
    </ul>
    <div class="drawer-social-section">
      <span class="drawer-social-title">Follow us</span>
      <div class="drawer-social-links">
        <a href="https://t.me/wjh_now" target="_blank" rel="noopener noreferrer">Telegram @wjh_now</a>
        <a href="https://x.com/wjhnow" target="_blank" rel="noopener noreferrer">X @wjhnow</a>
        <a href="https://facebook.com/wjhnow" target="_blank" rel="noopener noreferrer">Facebook @wjhnow</a>
      </div>
    </div>
  </nav>
</header>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const toggleBtn = document.getElementById("menuToggle");
    const navDrawer = document.getElementById("navDrawer");
    if (toggleBtn && navDrawer) {
      toggleBtn.addEventListener("click", function() {
        navDrawer.classList.toggle("active");
        toggleBtn.classList.toggle("open");
      });
    }
  });
</script>
