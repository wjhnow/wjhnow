<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "What Just Happened NOW",
  "alternateName": "wjhnow",
  "description": "The internet already has enough breaking news. We dig up the weird stuff instead — science, space, and tech facts you didn't know you needed.",
  "url": "https://wjhnow.com/"
}
</script>
{{- end }}

{{- if and .IsPage (eq .Kind "page") (not .IsHome) }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": {{ .Params.schemaType | default "BlogPosting" | jsonify | safeJS }},
  "headline": {{ .Title | jsonify | safeJS }},
  "description": {{ (.Description | default .Summary | plainify) | jsonify | safeJS }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  {{- with .Params.image }}
  "image": {{ . | absURL | jsonify | safeJS }},
  {{- end }}
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  },
  "author": {
    "@type": "Person",
    "name": {{ (.Params.author | default "Mr. JH") | jsonify | safeJS }},
    "url": "https://wjhnow.com/about-wjh.now/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "What Just Happened NOW",
    "url": "https://wjhnow.com/"
  }
}
</script>
{{- end }}
