{{ define "main" }}
<div class="wjh-cat-grid-wrap">
  <h1 class="wjh-cat-title">Categories</h1>
  <div class="wjh-cat-grid">
    {{ range site.Taxonomies.categories.Alphabetical }}
      {{ $term := .Page }}
      <a class="wjh-cat-card" href="{{ $term.RelPermalink }}">
        <span class="wjh-cat-name">{{ $term.Title }}</span>
        <span class="wjh-cat-count">{{ .Count }} {{ if eq .Count 1 }}post{{ else }}posts{{ end }}</span>
      </a>
    {{ end }}
  </div>
</div>
<style>
.wjh-cat-title{margin-bottom:1.2rem}.wjh-cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.5rem}.wjh-cat-card{display:flex!important;flex-direction:column!important;gap:.4rem!important;padding:1.6rem 1.5rem!important;border-radius:10px!important;background:#fff!important;border:1px solid #d0d0d0!important;box-shadow:0 1px 4px rgba(0,0,0,6%)!important;text-decoration:none!important;color:inherit!important;transition:transform .15s ease,box-shadow .15s ease}.wjh-cat-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,8%)}.wjh-cat-name{font-size:1.1rem!important;font-weight:700!important;text-transform:none!important;letter-spacing:normal!important;display:block!important}.wjh-cat-count{font-size:.85rem!important;opacity:.65!important;text-transform:none!important;letter-spacing:normal!important;display:block!important}@media(max-width:600px){.wjh-cat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
{{ end }}
