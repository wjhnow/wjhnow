{{ define "main" }}
<div class="wjh-cat-grid-wrap">
  <h1 class="wjh-cat-title">Categories</h1>
  <div class="wjh-cat-grid">
    {{ range site.Taxonomies.categories.Alphabetical }}
      {{ $term := .Page }}
      <a class="wjh-cat-card" href="{{ $term.RelPermalink }}">
        <span class="wjh-cat-name">{{ $term.Title }}</span>
        <span class="wjh-cat-count">{{ .Count }} {{ if eq .Count 1 }}post{{ else }}posts{{ end }}</span>
      </a>
    {{ end }}
  </div>
</div>

<style>
.wjh-cat-title { margin-bottom: 1.2rem; }
.wjh-cat-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:1rem; }
.wjh-cat-card {
  display:flex; flex-direction:column; gap:.4rem;
  padding:1.3rem 1.2rem; border-radius:10px;
  background: #ffffff;
  border: 1px solid #d0d0d0;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  text-decoration:none; color:inherit;
  transition: transform .15s ease, box-shadow .15s ease;
}
.wjh-cat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.wjh-cat-name { font-size:1.05rem; font-weight:700; }
.wjh-cat-count { font-size:.85rem; opacity:.65; }
@media (max-width: 600px) {
  .wjh-cat-grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
{{ end }}
